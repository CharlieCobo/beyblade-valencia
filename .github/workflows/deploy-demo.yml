name: Deploy demo (GitHub Pages + Firebase)

# Comprueba cada PR y publica el build de demo en la rama gh-pages al fusionar en master.
# La configuración de Firebase sale de las variables del repositorio (Settings > Secrets and variables >
# Actions > Variables): VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID y
# VITE_FIREBASE_APP_ID. No están en el repo.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # El emulador de Firestore (tests de las reglas) necesita Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:run
      - run: npm run test:rules
      - name: Build de demo
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          # Al publicar, una variable ausente rompería la demo en el navegador: se falla aquí.
          REQUIRE_FIREBASE_CONFIG: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ "$REQUIRE_FIREBASE_CONFIG" = "true" ]; then
            for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
              if [ -z "${!name}" ]; then echo "::error::Falta la variable del repositorio $name"; exit 1; fi
            done
          fi
          npm run build:demo
      - if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
